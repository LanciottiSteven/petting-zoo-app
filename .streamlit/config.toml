# Kept in lockstep with the tokens in pettingzoo/ui.py. Streamlit paints its own
# native widgets (data_editor, inputs, buttons) from these, so if they drift the
# board stops matching the cards around it.
[theme]
base = "dark"
primaryColor = "#5aa2ff"
backgroundColor = "#1e242e"
secondaryBackgroundColor = "#2e3743"
textColor = "#eef2f7"

[server]
maxUploadSize = 5
